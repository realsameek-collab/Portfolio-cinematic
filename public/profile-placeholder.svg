<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1200" width="820" height="1200" role="img" aria-label="Monogram placeholder avatar">
  <defs>
    <linearGradient id="pp-plinth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#8b7bd8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#71c4ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pp-mono" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="pp-glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="410" cy="520" rx="330" ry="330" fill="url(#pp-glow)"/>

  <!-- Soft bottom-anchored plinth, echoing the cut-out portrait silhouette -->
  <path d="M410 210c150 0 250 104 250 250v740H160V460c0-146 100-250 250-250z"
        fill="url(#pp-plinth)"/>
  <path d="M410 210c150 0 250 104 250 250v740H160V460c0-146 100-250 250-250z"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Monogram -->
  <text x="410" y="640" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif"
        font-size="420" font-weight="500" fill="url(#pp-mono)">A</text>

  <text x="410" y="740" text-anchor="middle"
        font-family="DM Sans, Helvetica, Arial, sans-serif"
        font-size="34" letter-spacing="14" fill="#ffffff" fill-opacity="0.45">ABDULLAH</text>
</svg>
